name: Cache-bust estáticos

# Actualiza el query string "?v=<sha>" de los <link>/<script> locales en
# index.html y admin/index.html en cada push real a main que toque
# HTML/CSS/JS — así el deploy de GitHub Pages obliga a navegadores y al
# CDN a traer la versión nueva en vez de servir una copia cacheada
# (ver scripts/cache-bust.js para el detalle).
#
# El commit que arma este workflow lleva "[skip ci]" en el mensaje para
# no volver a dispararse a sí mismo (GitHub Actions no corre ningún
# workflow sobre un push cuyo mensaje tenga esa marca).
#
# workflow_dispatch queda para poder correrlo a mano desde la pestaña
# Actions (por ejemplo, para probarlo en una rama que no sea main).

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "admin/index.html"
      - "css/**"
      - "js/**"
      - "admin/admin.css"
      - "admin/admin.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-bust:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Actualizar "?v=<sha>" en los estáticos
        run: node scripts/cache-bust.js
        env:
          CACHE_BUST_VERSION: ${{ github.sha }}

      - name: Commitear y pushear si cambió algo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html admin/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios de versión, nada que commitear."
          else
            git commit -m "chore: cache-bust a ${GITHUB_SHA::7} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
